user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    # Keep this slightly above the 10 MB per-image application limit to leave
    # room for multipart form fields and boundaries.
    client_max_body_size 12m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    server {
        listen 443 ssl;
        server_name localhost 127.0.0.1;

        error_page 413 = @payload_too_large;

        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_session_cache shared:SSL:10m;

        location /media/ {
            alias /var/www/media/;
        }

        location /static/ {
            alias /var/www/static/;
        }

        location /api/ {
            proxy_pass http://backend:8000;
        }

        location /admin/ {
            proxy_pass http://backend:8000;
        }

        location /ws/ {
            proxy_pass http://backend:8000;
        }

        location / {
            proxy_pass http://frontend:80;
        }

        location @payload_too_large {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 413 '{"detail":"Image must be 10 MB or smaller."}';
        }
    }
}
